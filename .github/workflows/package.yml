name: Release Executables

# Builds standalone executables (no .NET install needed) and attaches them to the GitHub release.
# Run it by hand from the Actions tab to get the executables as build artifacts without a release.
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-executable:
    permissions:
      contents: write
    strategy:
      matrix:
        target: [osx-arm64, osx-x64, linux-x64, linux-arm64, win-x64]
        include:
          - target: osx-arm64
            os: macos-latest
          - target: osx-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build ${{ matrix.target }} executable
        run: dotnet publish -r ${{ matrix.target }} -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:IncludeAllContentForSelfExtract=true -p:PublicRelease=true Pitwall.Console/Pitwall.Console.csproj -o ${{ matrix.target }}-output

      - name: Attach ${{ matrix.target }} to the release
        uses: svenstaro/upload-release-action@v2
        if: ${{ github.event_name == 'release' }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.target }}-output/${{ contains(matrix.target, 'win') && 'pitwall.exe' || 'pitwall' }}
          asset_name: pitwall-${{ matrix.target }}${{ contains(matrix.target, 'win') && '.exe' || '' }}
          tag: ${{ github.ref }}

      - name: Upload ${{ matrix.target }} as a build artifact
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: pitwall-${{ matrix.target }}${{ contains(matrix.target, 'win') && '.exe' || '' }}
          path: ${{ matrix.target }}-output/${{ contains(matrix.target, 'win') && 'pitwall.exe' || 'pitwall' }}
          overwrite: true
